# 掌阅 ↔ Kavita 补丁配置
MARKER="ZY-KAVITA-PATCH"
PATCH_VERSION="0.4.2"

# 自动同步钩子 (Kavita 读书页触发)
#   进书 → pull (掌阅 -> Kavita, 只前进不回退, 位置变了才重载)
#   阅读存进度 → 去抖 AUTO_PUSH_DEBOUNCE 秒后 push (Kavita -> 掌阅)
#   AUTO_SYNC=0 完全关掉 (前端读 /zy/api/auto/cfg 自行判断)
AUTO_SYNC="1"
AUTO_PUSH_DEBOUNCE="8"
AUTO_PULL_GAP="120"

# Kavita 容器
CONTAINER="kavita"
CONTAINER_WWWROOT="/kavita/wwwroot"
KAVITA_URL="http://127.0.0.1:5000"

# 前端补丁的宿主目录 (推荐做法)
#   把 state/wwwroot/{index.html,zy-kavita-patch.js} 只读挂进容器:
#     -v /vol2/1001/kavita-zy-patch/state/wwwroot/index.html:/kavita/wwwroot/index.html:ro
#     -v /vol2/1001/kavita-zy-patch/state/wwwroot/zy-kavita-patch.js:/kavita/wwwroot/zy-kavita-patch.js:ro
#   挂上之后 docker compose up --build / 换镜像重建都不会丢补丁。
#   没挂 (旧做法) 就退回 docker cp 打进容器可写层 —— 重建即丢, 靠 heal 每 3 分钟重打。
WWWROOT_MOUNT_DIR="/vol2/1001/kavita-zy-patch/state/wwwroot"


# 后端 API (给前端调)
API_BIND="0.0.0.0"
API_PORT="5111"

# 控制台 (Kavita 里那个 link 指向的地方; 认证二维码 / 推拉 / 日志都在那边)
WEB_PORT="5012"

# 共享 token (install 时自动生成并固化)
TOKEN_FILE="/vol2/1001/kavita-zy-patch/state/token"

# 掌阅桥接代码位置 (复用已有 sync 包)
BRIDGE_ROOT="/vol2/1001/zhangyue-bridge"